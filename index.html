<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기술마켓 안내 AI 상담사 시범</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
.container { max-width: 760px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); padding: 24px; }
h1 { font-size: 24px; margin-bottom: 8px; }
.desc { color: #555; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.chat-box { border: 1px solid #ddd; border-radius: 8px; height: 360px; overflow-y: auto; padding: 16px; background: #fafafa; margin-bottom: 16px; }
.message { margin: 10px 0; line-height: 1.5; }
.user { text-align: right; color: #1a5fb4; }
.bot { text-align: left; color: #222; }
input { width: 78%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
button { padding: 10px 16px; border: none; border-radius: 6px; background: #1a5fb4; color: white; font-size: 14px; cursor: pointer; }
.quick { margin-top: 12px; }
.quick button { background: #e9eef7; color: #1a5fb4; margin: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
<h1>기술마켓 안내 AI 상담사 시범</h1>
<div class="desc">
기술마켓 관련 반복 문의에 대응하기 위한 FAQ 기반 상담 지원 도구 예시입니다.<br>
실제 운영 전에는 공단 공식 안내자료 및 담당부서 검토를 통해 답변 내용을 보완해야 합니다.
</div>
<div class="chat-box" id="chatBox">
<div class="message bot"><b>상담사:</b> 안녕하세요. 기술마켓 관련 기본 문의를 안내드립니다. 궁금한 내용을 입력해주세요.</div>
</div>
<input type="text" id="userInput" placeholder="예: 기술마켓이 무엇인가요?">
<button onclick="sendMessage()">질문하기</button>
<div class="quick">
<button onclick="quickAsk('기술마켓이 무엇인가요?')">기술마켓이 무엇인가요?</button>
<button onclick="quickAsk('특정공법 심의와 무슨 관련이 있나요?')">특정공법 심의와 관련</button>
<button onclick="quickAsk('어디서 신청하나요?')">신청 방법</button>
<button onclick="quickAsk('원가계산서는 어떤 자료가 필요한가요?')">원가계산서</button>
<button onclick="quickAsk('담당자 연락처를 알고 싶습니다')">문의처</button>
</div>
</div>
<script>
const faq = [
{keywords: ["기술마켓", "뭔가", "무엇", "개요", "정의"],
  answer: "중소기업 기술마켓은 공공기관과 중소기업 간 기술 교류를 활성화하고, 우수 기술의 공공기관 활용 기회를 확대하기 위한 플랫폼입니다. 등록된 기술은 공공기관 사업에 활용될 수 있으며, 기술 홍보 및 판로 확대에 도움이 될 수 있습니다."
},

{keywords: ["왜", "필요", "이유", "해야", "등록해야", "장점", "혜택", "좋은점"],
  answer: "기술마켓 등록을 통해 공공기관 사업 활용 가능성을 높이고 기술 홍보 및 공공시장 진입 기회를 확대할 수 있습니다. 또한 특정공법 심의 절차 변경에 따라 기술마켓 등록 기술의 활용이 확대되고 있어 관련 안내를 드리고 있습니다."
},

{keywords: ["특정공법", "심의", "관련", "연관", "관계"],
  answer: "2025년 특정공법 심의 절차 변경에 따라 기술마켓 등록 기술 활용이 확대되었습니다. 이에 따라 특정공법 심의를 통과한 업체를 대상으로 기술마켓 등록 관련 내용을 안내하고 있으며, 등록 의향 여부를 확인하고 있습니다."
},

{keywords: ["서류", "제출", "신청", "자료", "원가계산서", "필요서류"],
  answer: "주요 제출서류는 다음과 같습니다.<br><br>① 신기술 등록 신청서<br>② 서약서<br>③ 신기술 요약서<br>④ 신기술의 특성을 설명할 수 있는 자료<br>⑤ 건설공사에서의 활용 전망<br>⑥ 현장 적용 시방서<br>⑦ 유지관리지침서<br>⑧ 품질검사 전문기관의 시험성적서 및 시험시공 결과<br>⑨ 공인기관이 발행한 원가계산서와 경제성 분석 자료<br>⑩ 현장 적용실적이 있는 경우 국가가 인정하는 실적증명서<br>⑪ 신청기술 관련 산업재산권 내역<br>⑫ 그 밖에 성능 및 품질검토를 위하여 필요하다고 인정하여 요청한 자료<br>⑬ 중소기업 확인서<br><br>세부 제출 기준은 안내자료를 참고하시기 바랍니다."
},

{keywords: ["안내자료", "자료", "링크", "QR", "홈페이지", "정보"],
  answer: '기술마켓 안내자료는 아래 링크를 통해 확인하실 수 있습니다.<br><br><a href="https://www.kr.or.kr/boardCnts/fileDown.do?fileSeq=c408f14f207a11eab17f7844c64c49bc" target="_blank">기술마켓 안내자료 바로가기</a><br><br>QR코드를 통해서도 안내자료 확인이 가능합니다.'
},

{keywords: ["담당자", "연락처", "전화번호", "문의"],
  answer: "기술마켓 관련 문의는 장준혁 차장(042-607-4074) 또는 최성욱 과장(042-607-4073)에게 문의하실 수 있습니다."}

];

function addMessage(sender, text, cls) {
const chatBox = document.getElementById("chatBox");
const div = document.createElement("div");
div.className = "message " + cls;
div.innerHTML = "<b>" + sender + ":</b> " + text;
chatBox.appendChild(div);
chatBox.scrollTop = chatBox.scrollHeight;
}

function getAnswer(question) {
const q = question.replace(/\s/g, "").toLowerCase();
let best = null;
let score = 0;
faq.forEach(item => {
let current = 0;
item.keywords.forEach(k => { if (q.includes(k.toLowerCase())) current++; });
if (current > score) { score = current; best = item.answer; }
});
if (best) return best;
return "문의하신 내용은 기본 FAQ에 포함되어 있지 않습니다. 보다 자세한 안내가 필요하신 경우 장준혁 차장(042-607-4074) 또는 최성욱 과장(042-607-4073)에게 문의하여 주시기 바랍니다.";
}

function sendMessage() {
const input = document.getElementById("userInput");
const question = input.value.trim();
if (!question) return;
addMessage("사용자", question, "user");
addMessage("상담사", getAnswer(question), "bot");
input.value = "";
}

function quickAsk(text) {
document.getElementById("userInput").value = text;
sendMessage();
}

document.getElementById("userInput").addEventListener("keydown", function(e) {
if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
